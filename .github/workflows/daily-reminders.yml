name: Daily reminders

# Vercel's Hobby plan only allows once-a-day crons, but reminders must be checked hourly so
# each learner is nudged at their own local hour. GitHub Actions runs this for free.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminder route
        env:
          APP_URL: ${{ vars.APP_URL || 'https://learn-chinese-app.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret is not set"; exit 1; fi
          curl --fail --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/push/daily"
